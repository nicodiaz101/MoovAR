[versions]
kotlin                 = "2.1.0"
ksp                    = "2.1.0-1.0.29"
agp                    = "8.13.2"
compose-bom            = "2026.04.01"
lifecycle              = "2.9.0"
room                   = "2.7.1"
hilt                   = "2.57.1"
retrofit               = "2.11.0"
okhttp                 = "4.12.0"
protobuf               = "4.29.3"
gtfs-realtime          = "0.0.8"
osmdroid               = "6.1.20"
kotlinx-coroutines     = "1.9.0"
kotlinx-serialization  = "1.7.3"
navigation-compose     = "2.9.0"
coil                   = "3.1.0"
core-ktx               = "1.15.0"
lifecycle-runtime-ktx  = "2.8.7"
activity-compose       = "1.10.0"
junit                  = "4.13.2"
androidx-test-ext-junit = "1.2.1"
espresso-core          = "3.6.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler    = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[libraries]
# Compose
compose-bom                = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui                 = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics        = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-material3          = { group = "androidx.compose.material3", name = "material3" }
compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }
compose-animation          = { group = "androidx.compose.animation", name = "animation" }
compose-ui-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-manifest   = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4     = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Lifecycle / ViewModel / Activity
core-ktx                    = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
activity-compose            = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-ksp      = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Hilt
hilt-android       = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler      = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation    = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }

# Retrofit / OkHttp
retrofit                = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
security-crypto         = { group = "androidx.security", name = "security-crypto-ktx", version = "1.1.0" }
okhttp-core             = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging          = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Protobuf / GTFS
protobuf-kotlin  = { group = "com.google.protobuf", name = "protobuf-kotlin-lite", version.ref = "protobuf" }
gtfs-realtime    = { group = "org.mobilitydata", name = "gtfs-realtime-bindings", version.ref = "gtfs-realtime" }

# Osmdroid (sin Google Maps)
osmdroid = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }

# Coil
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }

# Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Testing
junit                   = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
espresso-core           = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
coroutines-test         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
